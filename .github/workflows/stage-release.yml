name: Publish staged pre-release
on:
  push:
    branches: [ 'stage-v*' ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer hash
        run: echo "5c5eb2b2e29f8c1ea92af206081666045be1d4fc394d5c431715673bc38b447e  stage/Flownook_1.7.6_x64-setup.exe" | sha256sum -c -
      - name: Create pre-release (not latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#stage-}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Flownook ${TAG#v} (pre-release)" --notes-file stage/notes.md \
            --prerelease --latest=false \
            stage/Flownook_*_x64-setup.exe stage/Flownook_*_x64-setup.exe.sig stage/latest.json
      - name: Delete staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
